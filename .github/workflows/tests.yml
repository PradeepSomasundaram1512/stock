name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-stock-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the cloud image's light dependencies
        run: pip install pandas numpy yfinance requests google-auth google-cloud-storage scikit-learn scipy
      - name: Python compiles
        run: python -m compileall -q audit_core.py forward_test.py market_snapshot.py scan_universe.py track_record.py daily_digest.py shadow.py input_log.py ablation.py meta_label.py paper_power.py paper_power_intraday.py paper_sensitivity.py paper_forward_status.py dashboard tests deploy/gcp
      - name: Shell scripts parse
        run: for f in entrypoint.sh deploy/gcp/*.sh; do bash -n "$f" || exit 1; done
      - name: Dashboard JavaScript parses
        run: python tests/check_frontend.py
      - name: Dashboard sign-in, security and endpoint tests
        run: python dashboard/test_auth.py
      - name: Market clock tests
        run: python dashboard/test_market_clock.py
      - name: Track-record chain tests
        run: python tests/test_track_record.py
      - name: Scan-universe tests
        run: python tests/test_scan_universe.py
      - name: Daily-digest system-check tests
        run: python tests/test_digest_checks.py
      - name: Multi-model shadow tests
        run: python tests/test_shadow_multi.py
      - name: Input-log tests
        run: python tests/test_input_log.py
      - name: Ablation tests
        run: python tests/test_ablation.py
      - name: Meta-labeling tests
        run: python tests/test_meta_label.py
      - name: Audit-core tests
        run: python tests/test_audit_core.py
      - name: Forward-status tests
        run: python tests/test_forward_status.py
